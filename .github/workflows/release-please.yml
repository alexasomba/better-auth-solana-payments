name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish to npm (for example, v0.1.1)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release and publish
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release
        id: release
        if: ${{ inputs.release_tag == '' }}
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json

      - name: Resolve release tag
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.release_tag != '' }}
        shell: bash
        run: |
          TAG="${{ inputs.release_tag || steps.release.outputs.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Release Please returned unexpected tag '$TAG'. Expected vX.Y.Z."
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_ENV"
          echo "release_version=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout release tag
        if: ${{ env.release_tag != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.release_tag }}

      - name: Enable Corepack
        if: ${{ env.release_tag != '' }}
        run: corepack enable

      - name: Setup Node
        if: ${{ env.release_tag != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        if: ${{ env.release_tag != '' }}
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        if: ${{ env.release_tag != '' }}
        run: pnpm install --frozen-lockfile

      - name: Install TanStack example dependencies
        if: ${{ env.release_tag != '' }}
        run: pnpm --dir examples/tanstack install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Check
        if: ${{ env.release_tag != '' }}
        run: pnpm exec vp check

      - name: Test
        if: ${{ env.release_tag != '' }}
        run: pnpm exec vp test

      - name: Build package
        if: ${{ env.release_tag != '' }}
        run: pnpm exec vp pack

      - name: Lint package metadata
        if: ${{ env.release_tag != '' }}
        run: pnpm run lint:package

      - name: Lint package types
        if: ${{ env.release_tag != '' }}
        run: pnpm run lint:types

      - name: Pack and inspect release tarball
        if: ${{ env.release_tag != '' }}
        id: pack
        shell: bash
        run: |
          PACK_DIR="$RUNNER_TEMP/npm-pack"
          mkdir -p "$PACK_DIR"
          pnpm pack --pack-destination "$PACK_DIR"

          TARBALL="$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [[ -z "$TARBALL" ]]; then
            echo "::error ::pnpm pack did not produce a tarball."
            exit 1
          fi

          tar -xOf "$TARBALL" package/package.json > "$PACK_DIR/package.json"
          PACKED_NAME="$(node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(pkg.name);' "$PACK_DIR/package.json")"
          PACKED_VERSION="$(node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(pkg.version);' "$PACK_DIR/package.json")"
          if [[ "$PACKED_NAME" != "better-auth-solana-payments" ]]; then
            echo "::error ::Packed name $PACKED_NAME does not match better-auth-solana-payments."
            exit 1
          fi
          if [[ "$PACKED_VERSION" != "$release_version" ]]; then
            echo "::error ::Packed version $PACKED_VERSION does not match release tag $release_tag."
            exit 1
          fi

          echo "package_name=$PACKED_NAME" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Check npm version
        if: ${{ env.release_tag != '' }}
        id: npmjs
        shell: bash
        run: |
          if npm view "${{ steps.pack.outputs.package_name }}@$release_version" version --registry "https://registry.npmjs.org" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.pack.outputs.package_name }}@$release_version already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with trusted publishing
        if: ${{ env.release_tag != '' && steps.npmjs.outputs.exists != 'true' }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --tag latest
