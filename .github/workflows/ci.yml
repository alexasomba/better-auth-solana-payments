name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Install TanStack example dependencies
        run: pnpm --dir examples/tanstack exec vp install --frozen-lockfile -- --config.minimumReleaseAge=0

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Build package
        run: vp pack

      - name: Lint package metadata
        run: vp run lint:package

      - name: Lint package types
        run: vp run lint:types

      - name: Check TanStack example
        run: pnpm --dir examples/tanstack exec vp check

      - name: Test TanStack example
        run: pnpm --dir examples/tanstack exec vp test

      - name: Build TanStack example
        run: pnpm --dir examples/tanstack exec vp build
